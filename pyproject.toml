[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vertical-island-baker"
version = "0.1.0"
description = "Clean-room procedural baker for vertically stacked climbing islands."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "2333qbyqby" }]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.scripts]
island-baker = "vertical_island_baker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

